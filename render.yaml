services:
  # -------------------------------------------------------------
  # KoreX FastAPI Backend Service (Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: korex-api
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && pip install -e ."
    startCommand: "python -m uvicorn services.api.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NOTION_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: NOTION_PARENT_PAGE_ID
        sync: false

  # -------------------------------------------------------------
  # KoreX Web Frontend (Free Static Site CDN)
  # -------------------------------------------------------------
  - type: web
    name: korex-web
    runtime: static
    buildCommand: "npm --prefix apps/web install && npm --prefix apps/web run build"
    staticPublishPath: "./apps/web/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://korex-api-tuqp.onrender.com
