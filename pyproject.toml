[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "korex"
version = "0.1.0"
description = "KoreX -- KIIT EventOps AI Command Center: an AI-powered event digital twin, operational command center, simulation and adaptive-response platform."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "KoreX Team" },
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<6",
    "langchain>=0.3,<1",
    "langgraph>=0.2,<2",
    "langsmith>=0.2,<1",
    "ortools>=9.11,<10",
    "httpx>=0.28,<1",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "celery[redis]>=5.4,<6",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28,<2",
    "opentelemetry-exporter-prometheus>=0.49b0",
    "prometheus-client>=0.21,<1",
    "structlog>=24.4,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pyright>=1.1,<2",
    "pre-commit>=4.0,<5",
    "httpx>=0.28,<1",
    "factory-boy>=3.3,<4",
    "faker>=33.0,<34",
]

[tool.hatch.build.targets.wheel]
packages = ["services", "packages", "ai", "integrations"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["services", "packages", "ai", "integrations"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "ortools.*",
    "langchain.*",
    "langgraph.*",
    "langsmith.*",
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: unit tests (no I/O)",
    "integration: integration tests (requires services)",
    "e2e: end-to-end tests",
    "golden: golden-scenario regression tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["services", "packages", "ai", "integrations"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "@overload",
]
